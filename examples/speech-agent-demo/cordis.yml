# Speech-agent demo: wires the ctx.speech Deepgram Flux STT/TTS providers and
# a DeepSeek ctx.llm route. Application code (see README.md) opens sessions
# through ctx.speech, opens a model route through ctx.llm, and drives a
# SpeechAgentController (@deepseek-ai/dsh-speech-agent) to run the
# conversation loop; this file only wires the plugins, per examples/AGENTS.md.
#
# Set DEEPGRAM_API_KEY and DEEPSEEK_API_KEY in the environment or the root
# .env file; never inline credentials here.

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: session
  name: '@deepseek-ai/dsh-session'

- id: speech
  name: '@deepseek-ai/dsh-speech'

- id: speech-deepgram-flux-stt
  name: '@deepseek-ai/dsh-speech-deepgram-flux-stt'
  config:
    # apiKey falls back to $DEEPGRAM_API_KEY when omitted.
    model: flux-general-en

- id: speech-deepgram-flux-tts
  name: '@deepseek-ai/dsh-speech-deepgram-flux-tts'
  config:
    # apiKey falls back to $DEEPGRAM_API_KEY when omitted.
    model: flux-alexis-en

- id: llm
  name: '@deepseek-ai/dsh-llm'

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
