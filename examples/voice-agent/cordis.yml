# Voice agent example: loads the Deepgram Flux STT and TTS providers into
# ctx.voice so application code can call ctx.voice.openStt()/openTts()
# without importing provider details directly. run.ts drives the demo.
#
# Set DEEPGRAM_API_KEY in the environment or the root .env file; never inline
# credentials here.

- id: credentials
  name: '@deepseek-ai/dsh-credentials-local'

- id: voice
  name: '@deepseek-ai/dsh-voice'

- id: flux-stt
  name: '@deepseek-ai/dsh-flux-stt'
  config:
    # apiKeyEnv falls back to $DEEPGRAM_API_KEY when omitted.
    model: flux-general-en

- id: flux-tts
  name: '@deepseek-ai/dsh-flux-tts'
  config:
    # apiKeyEnv falls back to $DEEPGRAM_API_KEY when omitted.
    model: flux-alexis-en
